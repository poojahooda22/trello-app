name: CI

on:
  # Main is covered by the deploy workflow, which calls this one, so pushes
  # there are not checked twice.
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # backend imports db/client, which re-exports ./generated/prisma. That
      # directory is gitignored, so nothing type-checks until this has run.
      # No database is contacted: generate reads the schema only.
      - name: Generate Prisma client
        run: bunx prisma generate
        working-directory: packages/db

      - name: Type-check every workspace
        run: bun run check-types

      - name: Unit tests
        run: bun test

  images:
    # Building here is the only place the Dockerfiles are proven to work; a
    # broken one would otherwise surface during a deploy.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend, websockets]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
