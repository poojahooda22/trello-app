name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Two overlapping runs would race on `docker compose up`
# and on the migration container.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # The same checks CI runs, reused rather than copied, so a red build cannot
  # reach the server.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend, websockets]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built here, not on the box: a t3.small has 2 GB of RAM, and three Bun
      # installs would either swap or be killed.
      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/trello-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/trello-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/trello-app
            # compose.yml and the Caddyfile live in git; .env does not and is
            # never touched by a deploy.
            git fetch --prune origin main
            git reset --hard origin/main
            docker compose pull
            # `up` runs the migration container first and waits for it to exit
            # cleanly before the backend starts. See docker-compose.yml.
            docker compose up -d --remove-orphans
            docker image prune -f
